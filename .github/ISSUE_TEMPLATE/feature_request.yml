name: Feature request
description: Suggest something Linedesk should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today? Who runs into it (owner, team member, caller)?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How it could work. Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
