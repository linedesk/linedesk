name: CI

on:
  pull_request:
  push:
    branches: [main, master-dev, master-prod]
  # By hand (Actions → CI → Run workflow).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Runners: GitHub-hosted `ubuntu-24.04`, unless the repository variable `CI_RUNNER` names other runners (a repository
# with its own runners sets it). A pull request from a fork always runs GitHub-hosted. Never set CI_RUNNER for the
# whole organization.
jobs:
  # master-prod only takes merges of master-dev (docs/ci.md, "Branches"): a pull request into it from any other branch
  # (or from a fork) turns red before the merge.
  release-source:
    if: github.event_name == 'pull_request' && github.base_ref == 'master-prod'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 2
    steps:
      - name: The pull request must come from master-dev
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          [ "$HEAD_REF" = master-dev ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] ||
            { echo "master-prod only takes merges of master-dev, not $HEAD_REPO:$HEAD_REF"; exit 1; }

  # The release translation pass (docs/translations.md) is required: a release pull request (base master-prod) turns
  # red while any string is untranslated in a language or was translated from older English, or while
  # hardcoded-baseline.json still lists a file with hardcoded English. The failing keys are listed in the log and in
  # the run's summary; `pnpm i18n:changed` lists what the pass has to cover.
  # Hotfix: a release pull request labelled `hotfix` skips the pass (decision of 2026-11-15); the next release catches up.
  # The label is read when the job runs, so labelling after the run means re-running this job.
  release-translations:
    if: github.event_name == 'pull_request' && github.base_ref == 'master-prod'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Hotfix label
        id: hotfix
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name')
          if printf '%s\n' "$labels" | grep -qx hotfix; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Labelled hotfix: the release translation pass is skipped (docs/translations.md, \"Hotfixes\")."
            {
              echo "## Hotfix: translation pass skipped"
              echo
              echo "This release pull request is labelled \`hotfix\`, so \`pnpm i18n:check --complete\` did not run."
              echo "New or changed strings show in English until the next release's translation pass."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.hotfix.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: steps.hotfix.outputs.skip != 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - if: steps.hotfix.outputs.skip != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - if: steps.hotfix.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - name: Every string translated and current, no hardcoded English left
        if: steps.hotfix.outputs.skip != 'true'
        run: |
          set +e
          pnpm i18n:check --complete > i18n-check.log 2>&1
          status=$?
          cat i18n-check.log
          if [ "$status" -ne 0 ]; then
            {
              echo "## Translations missing or stale, or hardcoded English left"
              echo
              echo "Run the release translation pass (docs/translations.md) and move any hardcoded English to keys, then push to the trunk."
              echo
              echo '```'
              grep '^error:' i18n-check.log | head -300
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

  # Fast checks only: typecheck, lint, the language check, the scrub tests and the Zapier app's tests (~20 s). The
  # full test suite runs in tests.yml (docs/ci.md, "Tests").
  check:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Languages (docs/translations.md): catalogs valid, every key used and defined, no new hardcoded English in the
      # web app. Missing translations are fine here (English shows instead); releases check them (release-translations).
      - run: pnpm i18n:check
      # What error reports and log lines may send to Sentry (packages/scrub; about 2 s, no database needed).
      - run: pnpm --filter @linedesk/scrub test
      # Shell script checks (scripts/*.test.sh, about 1 s): the step only runs where there are any.
      - if: hashFiles('scripts/*.test.sh') != ''
        run: for f in scripts/*.test.sh; do bash "$f"; done
      # The migrations journal in order: a `when` not after the one before is skipped by the migrator on installs past it
      # (packages/db/scripts/check-journal.ts; about 1 s, no database needed).
      - run: pnpm db:check-journal
      # The Zapier app has every public action of the registry (packages/actions/scripts/zapier.ts): a new or changed
      # one needs `pnpm zapier:generate`, so it reaches Zapier with the release. Then the app's own tests
      # (no network, no Zapier account; about 2 s).
      - run: pnpm zapier:generate --check
      - run: npm ci --no-audit --no-fund && npm test
        working-directory: integrations/zapier

  # Self-hosting must work at every commit: the images build. (The agent image is not built here; it is large.)
  images:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: docker build --target api -t linedesk-api .
      - run: docker build --target web -t linedesk-web .
      - run: docker build --target proxy -t linedesk-proxy .
      # Platforms that build the Dockerfile without a target must get the API (docs/self-hosting.md, "Deploy methods").
      - name: Default target is the API
        run: |
          docker build -t linedesk-default .
          docker image inspect -f '{{json .Config.Entrypoint}}' linedesk-default | grep -q api-entrypoint.sh

  # No secrets in the repo: gitleaks scans the whole history of the commit under test (about 2 s), rules and exceptions
  # in .gitleaks.toml. Only HEAD's history, not every branch (gitleaks' default --all): otherwise one branch with a
  # finding turns every other pull request and the trunk red until it is deleted.
  # The binary is pinned by version and checksum instead of gitleaks-action, which needs a paid licence for organisations.
  secrets:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$file" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$file"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$file" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" gitleaks
      - name: Scan history
        run: $RUNNER_TEMP/gitleaks git --no-banner --redact --verbose --log-opts=HEAD .
