name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast checks only while we build: typecheck and lint (~10 s). The test suite runs in tests.yml,
  # by hand or for a release, not on every pull request (docs/ci.md).
  check:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  # Self-hosting must work at every commit: the images build. (The agent image is not built here; it is large.)
  images:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target api -t linedesk-api .
      - run: docker build --target web -t linedesk-web .
      - run: docker build --target proxy -t linedesk-proxy .
