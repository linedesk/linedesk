name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: linedesk
          POSTGRES_PASSWORD: linedesk
          POSTGRES_DB: linedesk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U linedesk"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      # Each run of the API integration tests creates its own database next to this one (the name must end in _test).
      TEST_DATABASE_URL: postgres://linedesk:linedesk@localhost:5432/linedesk_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # Self-hosting must work at every commit: the images build. (The agent image is not built here; it is large.)
  images:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target api -t linedesk-api .
      - run: docker build --target web -t linedesk-web .
      - run: docker build --target proxy -t linedesk-proxy .
