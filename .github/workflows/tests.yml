# The full test suite, in four parallel parts: the API tests in three shards (they take most of the time), every other
# package in one. Runs on every push to master-dev and by hand (Actions → Tests → Run workflow). It never blocks a
# deploy: staging and production deploy without it, and a failure shows in Actions and on the intranet.
name: Tests

on:
  push:
    branches: [master-dev]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to master-dev replaces the run of the older one.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.part }})
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # No "/" in the names: GitHub leaves jobs with one out of `gh run view --log`.
        part: [api 1 of 3, api 2 of 3, api 3 of 3, other packages]
    services:
      postgres:
        image: postgres:17@sha256:846a7ddaa67a4b354ae1d21087b683901aa6113a4ed626d3787cfbf6c85e3e07
        env:
          POSTGRES_USER: linedesk
          POSTGRES_PASSWORD: linedesk
          POSTGRES_DB: linedesk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U linedesk"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      # Each run of the API integration tests creates its own database next to this one (the name must end in _test).
      TEST_DATABASE_URL: postgres://linedesk:linedesk@localhost:5432/linedesk_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run this part of the tests
        env:
          PART: ${{ matrix.part }}
        run: |
          case "$PART" in
            "api "*) part=${PART#api }; pnpm --filter @linedesk/api exec vitest run --shard="${part%% of *}/${part##* of }" ;;
            *) pnpm turbo run test --continue --filter='!@linedesk/api' ;;
          esac
