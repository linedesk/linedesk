# The full test suite, in four parallel parts: the API tests in three shards (they take most of the time), every other
# package in one. It runs beside the deploys, never in front of them (docs/ci.md, "Tests"):
#   - every push to master-dev: staging deploys without waiting for it. A red run comments on the PR that was merged
#     (job `report`), so the person or AI session that merged it sees it and fixes it in a new PR.
#   - pull requests from autopilot/ branches: the autopilot merges only when this passed (ops/autopilot, wait_ci).
#   - the release gate releases only when this passed on exactly the release head (ops/autopilot, release gate).
#   - by hand (Actions → Tests → Run workflow).
# Pull requests from people do not run it: they need typecheck, lint and the image build (ci.yml) only.
name: Tests

on:
  push:
    branches: [master-dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to master-dev (or to the same pull request) replaces the run of the older one.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.part }})
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'autopilot/')
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # No "/" in the names: GitHub leaves jobs with one out of `gh run view --log`.
        part: [api 1 of 3, api 2 of 3, api 3 of 3, other packages]
    services:
      postgres:
        image: postgres:17@sha256:846a7ddaa67a4b354ae1d21087b683901aa6113a4ed626d3787cfbf6c85e3e07
        env:
          POSTGRES_USER: linedesk
          POSTGRES_PASSWORD: linedesk
          POSTGRES_DB: linedesk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U linedesk"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      # Each run of the API integration tests creates its own database next to this one (the name must end in _test).
      TEST_DATABASE_URL: postgres://linedesk:linedesk@localhost:5432/linedesk_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run this part of the tests
        env:
          PART: ${{ matrix.part }}
        run: |
          case "$PART" in
            "api "*) part=${PART#api }; pnpm --filter @linedesk/api exec vitest run --shard="${part%% of *}/${part##* of }" ;;
            *) pnpm turbo run test --continue --filter='!@linedesk/api' ;;
          esac

  # A red run on master-dev: one comment on the PR the head commit came from (or on the commit, for a direct push),
  # written for whoever merged it, a person or an AI session that watches its PR.
  report:
    needs: test
    if: failure() && github.event_name == 'push'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # commit comments
      pull-requests: write
      actions: read
    steps:
      - name: Comment on the merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')
          body="**Tests failed on master-dev** after this merge (\`${SHA:0:8}\`): ${failed:-see the run}.

          Run: $RUN_URL (failed logs: \`gh run view $RUN_ID --repo $REPO --log-failed\`).

          Whoever merged this, a person or an AI session: please fix it in a new PR into master-dev, or say here why it is not caused by this change. The cause can also be an earlier commit since the last green run of Tests. Staging is already deployed; production is not blocked by this, so fix it before the next release."
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.base.ref == "master-dev" and .merged_at != null)][0].number // empty')
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --repo "$REPO" --body "$body"
          else
            gh api "repos/$REPO/commits/$SHA/comments" -f body="$body" >/dev/null
          fi
