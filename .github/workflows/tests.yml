# The full test suite, in four parallel parts: the API tests in three shards (they take most of the time), every other
# package in one. Runs on every push to master-dev, by hand (Actions → Tests → Run workflow), and for every release:
# deploy-production.yml calls it with the release commit and reuse: true. A release commit holds the files of a
# master-dev commit (deploy-production.yml checks that); when that master-dev commit's own Tests run passed, each part
# reports success at once instead of running the same tests on the same files again. The production server still
# requires every "tests / ..." job of the release run to have succeeded (scripts/receive-release.sh).
name: Tests

on:
  push:
    branches: [master-dev]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The commit to test
        type: string
        required: true
      reuse:
        description: Report success when a master-dev Tests run already passed on the same files
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# A newer push to master-dev replaces the run of the older one; a release's run is never cancelled.
concurrency:
  group: tests-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ !inputs.ref }}

jobs:
  test:
    name: test (${{ matrix.part }})
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [api 1/3, api 2/3, api 3/3, other packages]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: linedesk
          POSTGRES_PASSWORD: linedesk
          POSTGRES_DB: linedesk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U linedesk"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      # Each run of the API integration tests creates its own database next to this one (the name must end in _test).
      TEST_DATABASE_URL: postgres://linedesk:linedesk@localhost:5432/linedesk_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0 # the reuse step looks for the release's files in master-dev's history
      - name: Reuse a passed master-dev run of the same files (releases only)
        id: reuse
        if: inputs.reuse
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          tree=$(git rev-parse "$REF^{tree}")
          for sha in $(git log origin/master-dev -n 500 --format='%H %T' | awk -v tree="$tree" '$2 == tree { print $1 }'); do
            url=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs?branch=master-dev&event=push&status=success&head_sha=$sha" \
              --jq '.workflow_runs[0].html_url // empty') || url="" # an API error only means: run the tests
            if [ -n "$url" ]; then
              echo "The tests already passed on these exact files (master-dev $sha): $url"
              echo "found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No passed master-dev run for these files: running the tests."
      - if: steps.reuse.outputs.found != 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - if: steps.reuse.outputs.found != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - if: steps.reuse.outputs.found != 'true'
        run: pnpm install --frozen-lockfile
      - name: Run this part of the tests
        if: steps.reuse.outputs.found != 'true'
        env:
          PART: ${{ matrix.part }}
        run: |
          case "$PART" in
            "api "*) pnpm --filter @linedesk/api exec vitest run --shard="${PART#api }" ;;
            *) pnpm turbo run test --continue --filter='!@linedesk/api' ;;
          esac
