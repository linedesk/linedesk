# The full test suite. Not part of the everyday flow (ci.yml only typechecks and lints):
# run it by hand (Actions → Tests → Run workflow); a release tag (v*) runs it before production
# (deploy-production.yml calls it, and a failing test stops the release).
name: Tests

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The commit to test
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: linedesk
          POSTGRES_PASSWORD: linedesk
          POSTGRES_DB: linedesk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U linedesk"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      # Each run of the API integration tests creates its own database next to this one (the name must end in _test).
      TEST_DATABASE_URL: postgres://linedesk:linedesk@localhost:5432/linedesk_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --continue
