# Developer Certificate of Origin (CONTRIBUTING.md): every commit of a pull request carries a `Signed-off-by:` line.
# A plain check of the commit messages, no third-party app. Runs only in the public repository (linedesk/linedesk);
# the maintainers' private copy keeps its own flow. Merge commits (more than one parent) are skipped.
name: DCO

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sign-off:
    if: github.repository == 'linedesk/linedesk'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every commit is signed off
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          missing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --jq '
            .[] | select((.parents | length) < 2)
                | select(.commit.message | test("(^|\n)Signed-off-by: [^<\n]+ <[^>\n]+@[^>\n]+>\\s*($|\n)") | not)
                | "\(.sha[0:12]) \(.commit.message | split("\n")[0])"')
          if [ -n "$missing" ]; then
            echo "Commits without a Signed-off-by line (sign off with git commit -s; see CONTRIBUTING.md):"
            printf '%s\n' "$missing"
            {
              echo "## Missing sign-off (DCO)"
              echo
              echo "Every commit needs a \`Signed-off-by: Name <email>\` line (\`git commit -s\`)."
              echo "Fix the branch with \`git rebase --signoff ${{ github.event.repository.default_branch }}\` and \`git push --force-with-lease\`."
              echo
              echo '```'
              printf '%s\n' "$missing"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Every commit is signed off."
