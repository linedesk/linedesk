# Development additions to docker-compose.yml: local ports for the apps that run on the host
# (`pnpm dev`, the agent worker, the test page) and the recordings directory the host API reads.
# Used by `pnpm db:up`, `pnpm voice:up` and `pnpm recording:up`; never on a server.
services:
  # Also on the default network: Docker publishes no port of a container that is only on an internal network.
  postgres:
    ports: ["127.0.0.1:5433:5432"]
    networks: [backend, default]

  electric:
    ports: ["127.0.0.1:3001:3000"]
    networks: [backend, default]

  livekit:
    ports: ["127.0.0.1:7880:7880"] # API + WebSocket signalling

  livekit-egress:
    volumes: ["${RECORDINGS_DIR:-./data/recordings}:/recordings"]

  recordings-init:
    volumes: ["${RECORDINGS_DIR:-./data/recordings}:/recordings"]
