<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kontor Prototype White</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Sage palette from an earlier project (apps/web/src/app/globals.css). Light only.
   Sidebars on warm grey-beige, page on the lighter tone, everything with text on white. */
:root {
  color-scheme: light;
  --bg: #fafaf8; --surface: #ffffff; --surface-raised: #ffffff; --surface-hover: #f3f2ee;
  --line: #e7e4de; --line-control: #d8d3cb;
  --ink: #1c1917; --ink-muted: #645d57; --ink-disabled: #a8a29e;
  --action: #1c1917; --on-action: #fafaf8;
  --signal: #1c1917; --signal-soft: #f0efeb; --on-signal: #fafaf8;
  --bubble-out: #f3f2ee; --bubble-in: #ffffff; --bubble-caller: #1c1917;
  --info: #4a5f7a; --info-soft: #edf0f4; --read-tick: #4a5f7a; --focus: #1c1917;
  --warning: #b45309; --warning-soft: #fbf1e4;
  --danger: #b42318; --danger-soft: #fdecea; --on-danger: #ffffff; --live: #b42318;
  --speaker-caller: #1c1917; --speaker-ai: #8a827b; --speaker-agent: #4a5f7a;
  --sidebar: #f4f3ef; --sidebar-muted: #5f5852; --highlight: #f0efeb; --highlight-ink: #1c1917;
  --shadow-popover: 0 12px 32px -8px rgb(41 37 36 / 0.18), 0 2px 6px rgb(41 37 36 / 0.06);
  --shadow-dialog: 0 12px 32px -8px rgb(41 37 36 / 0.18), 0 2px 6px rgb(41 37 36 / 0.06);
  --shadow-card: 0 1px 2px rgb(41 37 36 / 0.05), 0 2px 8px -2px rgb(41 37 36 / 0.06);
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px;
  --radius-xs: 6px; --radius-sm: 8px; --radius-md: 10px; --radius-lg: 12px; --radius-bubble: 16px; --radius-full: 9999px;
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
body { background: var(--bg); color: var(--ink); }

/* Kontor components */

body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--ink); font-size: 14px; line-height: 20px; -webkit-font-smoothing: antialiased; }
.k-icon { display: block; flex: none; }

/* Kbd */
.k-kbds { display: inline-flex; gap: var(--space-1); }
.k-kbd { box-sizing: border-box; display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; font-family: var(--font-mono); font-size: 11px; font-weight: 500; line-height: 1; color: var(--ink-muted); background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-xs); }

/* Button */
.k-btn { box-sizing: border-box; display: inline-flex; align-items: center; gap: var(--space-2); height: 32px; padding: 0 var(--space-3); font: inherit; font-size: 13px; font-weight: 500; line-height: 1; border: 1px solid transparent; border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap; }
.k-btn:focus-visible, .k-send:focus-visible, .k-chat:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.k-btn-primary { background: var(--action); color: var(--on-action); }
.k-btn-primary:hover { opacity: .88; }
.k-btn-primary .k-kbd, .k-btn-danger .k-kbd { background: transparent; border-color: currentColor; color: inherit; opacity: .72; }
.k-btn-secondary { background: var(--surface-raised); color: var(--ink); border-color: var(--line); }
.k-btn-secondary:hover { background: var(--surface-hover); }
.k-btn-ghost { background: transparent; color: var(--ink-muted); }
.k-btn-ghost:hover { background: var(--surface-hover); color: var(--ink); }
.k-btn-danger { background: var(--danger); color: var(--on-danger); }
.k-btn-sm { height: 28px; padding: 0 10px; font-size: 12.5px; gap: 6px; }
.k-btn-sm .k-kbd { height: 18px; min-width: 18px; }
.k-btn-icon { width: 32px; padding: 0; justify-content: center; }
.k-btn-sm.k-btn-icon { width: 28px; }
.k-btn:disabled { background: var(--surface-hover); color: var(--ink-disabled); border-color: transparent; cursor: not-allowed; opacity: 1; }

/* Input */
.k-input { box-sizing: border-box; display: flex; align-items: center; gap: var(--space-2); height: 32px; padding: 0 var(--space-2) 0 10px; background: var(--surface); border: 1px solid var(--line-control); border-radius: var(--radius-sm); color: var(--ink-muted); }
.k-input:focus-within { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
.k-input input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 13.5px; color: var(--ink); padding: 0; }
.k-input input::placeholder, .k-composer-input::placeholder, .k-cmd-search input::placeholder { color: var(--ink-muted); opacity: 1; }

/* Badge */
.k-badge { box-sizing: border-box; display: inline-flex; align-items: center; gap: 6px; height: 20px; padding: 0 var(--space-2); border-radius: var(--radius-full); font-size: 12px; font-weight: 500; line-height: 1; white-space: nowrap; }
.k-badge-dot::before { content: ""; width: 6px; height: 6px; border-radius: var(--radius-full); background: currentColor; }
.k-badge-neutral { background: var(--surface-hover); color: var(--ink-muted); }
.k-badge-signal { background: var(--signal-soft); color: var(--signal); }
.k-badge-info { background: var(--info-soft); color: var(--info); }
.k-badge-warning { background: var(--warning-soft); color: var(--warning); }
.k-badge-danger { background: var(--danger-soft); color: var(--danger); }

/* Avatar */
.k-avatar { position: relative; display: inline-grid; place-items: center; flex: none; border-radius: var(--radius-full); background: var(--surface-hover); color: var(--ink); font-weight: 600; letter-spacing: .01em; }
.k-avatar-24 { width: 24px; height: 24px; font-size: 10px; }
.k-avatar-32 { width: 32px; height: 32px; font-size: 12px; }
.k-avatar-40 { width: 40px; height: 40px; font-size: 14px; }
.k-avatar-ai { background: var(--signal-soft); color: var(--signal); }
.k-presence { position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; border-radius: var(--radius-full); box-shadow: 0 0 0 2px var(--bg); }
.k-avatar-24 .k-presence { width: 8px; height: 8px; }
.k-presence-online { background: var(--signal); }
.k-presence-away { background: var(--warning); }

/* Day divider */
.k-day { display: flex; justify-content: center; padding: var(--space-2) 0; }
.k-day span { font-size: 12px; font-weight: 500; line-height: 16px; color: var(--ink-muted); background: var(--surface-raised); border: 1px solid var(--line); padding: 2px 10px; border-radius: var(--radius-full); }

/* Message bubble */
.k-msg { display: flex; padding: 1px 0; }
.k-msg-me { justify-content: flex-end; }
.k-msg-tail { margin-top: var(--space-2); }
.k-bubble { position: relative; box-sizing: border-box; max-width: min(72%, 520px); padding: 6px 10px 7px; border-radius: var(--radius-bubble); font-size: 14.5px; line-height: 20px; overflow-wrap: anywhere; }
.k-msg-them .k-bubble { background: var(--bubble-in); border: 1px solid var(--line); }
.k-msg-me .k-bubble { background: var(--bubble-out); color: var(--ink); }
.k-msg-them.k-msg-tail .k-bubble { border-top-left-radius: var(--radius-xs); }
.k-msg-me.k-msg-tail .k-bubble { border-top-right-radius: var(--radius-xs); }
.k-msg-author { font-size: 12.5px; font-weight: 600; line-height: 18px; color: var(--signal); }
.k-meta-space { display: inline-block; width: 40px; height: 1px; }
.k-msg-me .k-meta-space { width: 60px; }
.k-meta { position: absolute; right: 10px; bottom: 6px; display: inline-flex; align-items: center; gap: 3px; font-family: var(--font-mono); font-size: 11px; line-height: 1; color: var(--ink-muted); }
.k-ticks { display: inline-flex; color: var(--ink-muted); }
.k-ticks-read { color: var(--read-tick); }

/* Composer */
.k-composer { box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 6px; background: var(--surface); border: 1px solid var(--line-control); border-radius: var(--radius-md); }
.k-composer:focus-within { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
.k-composer-input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 14.5px; line-height: 20px; color: var(--ink); padding: 6px 4px; }
.k-composer-hint { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-muted); white-space: nowrap; }
.k-send { display: grid; place-items: center; flex: none; width: 32px; height: 32px; border: 0; border-radius: var(--radius-sm); background: var(--signal); color: var(--on-signal); cursor: pointer; }
.k-send:disabled { background: var(--surface-hover); color: var(--ink-disabled); cursor: default; }

/* Chat list item */
.k-chat { box-sizing: border-box; display: flex; align-items: center; gap: var(--space-3); width: 100%; padding: var(--space-2) var(--space-3); border: 0; border-radius: var(--radius-md); background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.k-chat:hover, .k-chat.is-active { background: var(--surface-hover); }
.k-chat-body { flex: 1; min-width: 0; display: grid; gap: 2px; }
.k-chat-top, .k-chat-bottom { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); min-width: 0; }
.k-chat-name { font-size: 14px; font-weight: 500; line-height: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.k-chat-time { flex: none; font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted); }
.k-chat-preview { font-size: 13px; line-height: 18px; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.k-chat.is-unread .k-chat-name { font-weight: 600; }
.k-chat.is-unread .k-chat-time { color: var(--signal); }
.k-chat.is-unread .k-chat-preview { color: var(--ink); }
.k-chat-typing { color: var(--signal); }
.k-count { box-sizing: border-box; flex: none; display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--radius-full); background: var(--signal); color: var(--on-signal); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* Command menu */
.k-cmd { box-sizing: border-box; width: 100%; max-width: 560px; background: var(--surface-raised); border-radius: var(--radius-lg); box-shadow: var(--shadow-dialog); overflow: hidden; }
.k-cmd-search { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-bottom: 1px solid var(--line); color: var(--ink-muted); }
.k-cmd-search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 15px; color: var(--ink); }
.k-cmd-list { padding: 6px; max-height: 300px; overflow: auto; }
.k-cmd-group { padding: 8px 10px 4px; font-size: 12px; font-weight: 500; line-height: 16px; color: var(--ink-muted); }
.k-cmd-item { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: var(--radius-sm); font-size: 13.5px; color: var(--ink); cursor: pointer; }
.k-cmd-item .k-icon { color: var(--ink-muted); }
.k-cmd-item[aria-selected="true"] { background: var(--surface-hover); }
.k-cmd-item[aria-selected="true"] .k-icon { color: var(--ink); }
.k-cmd-item .k-kbds { margin-left: auto; }
.k-cmd-empty { padding: var(--space-6) var(--space-3); text-align: center; font-size: 13px; color: var(--ink-muted); }
.k-cmd-foot { display: flex; flex-wrap: wrap; gap: var(--space-4); padding: var(--space-2) 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-muted); }
.k-cmd-foot span { display: inline-flex; align-items: center; gap: 6px; }

/* Message bubble: call variants */
.k-msg-me .k-msg-author { color: var(--ink-muted); }
.k-bubble.k-tone-signal { background: var(--bubble-caller); border-color: transparent; }
.k-bubble.k-tone-neutral { background: var(--bubble-in); border: 1px solid var(--line); }
.k-bubble.k-tone-signal .k-msg-author { color: var(--signal); }
.k-bubble.k-tone-neutral .k-msg-author { color: var(--ink-muted); }
.k-caret { display: inline-block; width: 2px; height: 16px; margin-left: 3px; vertical-align: -3px; background: currentColor; border-radius: 1px; }

/* Live indicator */
.k-livei { box-sizing: border-box; display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 var(--space-2); border-radius: var(--radius-full); font-size: 12px; font-weight: 500; line-height: 1; white-space: nowrap; }
.k-livei time { font-family: var(--font-mono); font-size: 11px; font-variant-numeric: tabular-nums; }
.k-livei-dot { display: inline-block; width: 6px; height: 6px; border-radius: var(--radius-full); background: currentColor; }
.k-livei-live { background: var(--danger-soft); color: var(--live); }
.k-livei-ringing { background: var(--warning-soft); color: var(--warning); }
.k-livei-hold { background: var(--info-soft); color: var(--info); }
.k-livei-ended { background: var(--surface-hover); color: var(--ink-muted); }
.k-chat-top .k-livei { height: 20px; }

/* Call timeline */
.k-tl { box-sizing: border-box; display: grid; gap: 6px; padding: var(--space-3) var(--space-4) 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); }
.k-tl-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-4); font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.k-tl-key { display: inline-flex; align-items: center; gap: 6px; }
.k-tl-key::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--k); }
.k-tl-key.caller { --k: var(--speaker-caller); }
.k-tl-key.ai { --k: var(--speaker-ai); }
.k-tl-key.agent { --k: var(--speaker-agent); }
.k-tl-key b { font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.k-tl-time { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; color: var(--ink); font-variant-numeric: tabular-nums; }
.k-tl-time .k-livei-dot { color: var(--live); }
.k-tl-row { display: flex; align-items: center; gap: var(--space-3); }
.k-play { display: grid; place-items: center; flex: none; width: 32px; height: 32px; border: 0; border-radius: var(--radius-full); background: var(--action); color: var(--on-action); cursor: pointer; }
.k-play:focus-visible, .k-tl-track:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.k-tl-track { position: relative; flex: 1; min-width: 0; height: 40px; display: flex; align-items: center; gap: 2px; cursor: pointer; border-radius: var(--radius-xs); }
.k-tl-track.is-live { cursor: default; }
.k-tl-bar { position: relative; z-index: 1; flex: 1; min-width: 1px; border-radius: 1px; }
.k-tl-bar.caller { background: var(--speaker-caller); }
.k-tl-bar.ai { background: var(--speaker-ai); }
.k-tl-bar.agent { background: var(--speaker-agent); }
.k-tl-bar.none { height: 2px; background: var(--line); }
.k-tl-played { position: absolute; z-index: 0; left: 0; top: -4px; bottom: -4px; background: var(--surface-hover); border-radius: var(--radius-xs); }
.k-tl-ph { position: absolute; z-index: 2; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; }
.k-tl-axis { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10.5px; line-height: 14px; color: var(--ink-muted); }
.k-tl-axis.has-play { padding-left: 44px; }

/* Call event */
.k-event { display: flex; align-items: center; gap: 10px; padding: var(--space-2) 0; font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.k-event::before, .k-event::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.k-event-in { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.k-event-in time { font-family: var(--font-mono); font-size: 11px; }

/* Call list item (extends .k-chat) */
.k-call-sum { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 13px; line-height: 18px; color: var(--ink-muted); }
.k-call-sum span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.k-call-dur { flex: none; font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted); }
.k-call.is-missed .k-call-sum .k-icon, .k-call.is-missed .k-chat-time { color: var(--danger); }

/* Call summary */
.k-summary { box-sizing: border-box; display: grid; align-content: start; gap: 14px; padding: var(--space-4); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); }
.k-summary-h { display: flex; align-items: center; gap: var(--space-2); }
.k-summary-h .k-icon { color: var(--signal); }
.k-summary-h b { font-size: 14px; font-weight: 600; }
.k-summary-h small { margin-left: auto; font-size: 12px; color: var(--ink-muted); }
.k-summary p { margin: 0; font-size: 13px; line-height: 19px; }
.k-summary dl { display: grid; grid-template-columns: auto 1fr; gap: 6px var(--space-3); margin: 0; font-size: 13px; line-height: 18px; }
.k-summary dt { color: var(--ink-muted); }
.k-summary dd { margin: 0; }
.k-summary-tasks { display: grid; gap: var(--space-2); }
.k-summary-label { font-size: 12px; font-weight: 500; color: var(--ink-muted); }
.k-task { display: flex; align-items: flex-start; gap: var(--space-2); font-size: 13px; line-height: 18px; cursor: pointer; }
.k-task input { flex: none; width: 14px; height: 14px; margin: 2px 0 0; accent-color: var(--signal); }
.k-summary-a { display: flex; flex-wrap: wrap; gap: var(--space-2); }

@media (prefers-reduced-motion: no-preference) {
  .k-livei-live .k-livei-dot, .k-tl-time .k-livei-dot { animation: k-pulse 1.4s ease-out infinite; }
  .k-caret { animation: k-blink 1s steps(1) infinite; }
}
@keyframes k-pulse { 0% { box-shadow: 0 0 0 0 currentColor; } 100% { box-shadow: 0 0 0 5px transparent; } }
@keyframes k-blink { 50% { opacity: 0; } }

/* Preview helpers */



/* Prototype */
/* Layout: permanent icon rail 56px | main. Calls work like Superhuman: full-width list, Enter opens the call full width, Esc goes back. Tokens from the Kontor design system above. */
html, body { height: 100%; }
body { overflow: hidden; }
#app { height: 100%; }
button { font: inherit; }
.k-btn > span { display: inline-flex; align-items: center; gap: 6px; }

.app { display: grid; grid-template-columns: 56px minmax(0, 1fr); height: 100%; background: var(--bg); color: var(--ink); }

/* Rail */
.nav { position: relative; z-index: 20; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 8px; padding-left: max(8px, env(safe-area-inset-left, 0px)); background: var(--surface); border-right: 1px solid var(--line); min-height: 0; }
.ws-mark { width: 28px; height: 28px; border-radius: var(--radius-sm); background: var(--signal); color: var(--on-signal); display: grid; place-items: center; margin-bottom: 10px; flex: none; }



.row:focus-visible, .r-act:focus-visible, .ib-tab:focus-visible, .sw:focus-visible, .opt:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }


.nav-foot { margin-top: auto; display: grid; gap: 2px; justify-items: center; padding-top: 8px; }


.nav-live { display: block; width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--live); box-shadow: 0 0 0 2px var(--surface); }


.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }

/* Inbox */
.ib-head { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; min-height: 52px; padding: 8px 24px; border-bottom: 1px solid var(--line); flex: none; }

.ib-tabs { display: flex; gap: 2px; flex-wrap: wrap; }
.ib-tab { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--ink-muted); font-size: 13.5px; font-weight: 500; cursor: pointer; }
.ib-tab:hover { color: var(--ink); }
.ib-tab[aria-selected="true"] { color: var(--ink); background: var(--surface-hover); }
.ib-tab .n { font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted); }
.ib-right { margin-left: auto; display: flex; gap: 6px; }
.ib-list { flex: 1; overflow: auto; min-height: 0; padding: 6px 0 24px; }
.row { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 24px; cursor: pointer; }
.row:hover { background: var(--surface); }
.row.is-cursor { background: var(--surface-hover); }
.r-dir { flex: none; color: var(--ink-muted); display: grid; }

/* =====================================================================
   Surface system (Superhuman-style). Single source of truth for elevation,
   radii, type scale, control sizes and interaction states. Overrides the
   scattered rules above; add new surfaces by picking a level, not a value.

   Elevation
     0  flat      page, list rows, header bars, docked panels: white + 1px --line hairline
     1  raised    white cards on the page (player, summary, settings sections, tables):
                  --shadow-1 = hairline ring + tight contact shadow + faint ambient. No border.
     2  floating  ⌘K, remind menu, search, help sheet, toast, tooltips: --shadow-2
     3  drawer    left nav sliding over a scrim: --shadow-3 (directional)
   Rules: a surface gets either a shadow token or a border, never both.
          Controls (inputs, textareas, kbd keycaps) keep a 1px border; secondary
          buttons and pressed segments use the small --shadow-xs instead.
   Radii   xs 6 (kbd, tooltip, inner segment) · sm 8 (buttons, inputs, menu/nav items)
           md = lg 12 (cards, popovers, dialogs, toast) · bubble 16 · full (badges, pills, avatars)
   Type    11 caption/label/mono · 12 secondary · 13 body/UI · 14 titles · 16 page title
           (onboarding hero sizes and the inbox-zero headline are deliberate exceptions)
   States  hover --surface-hover · selected --highlight (+ 2px --action bar on full-width rows)
           focus 2px --focus outline, 2px offset
   ===================================================================== */
:root {
  --surface-strong: #ebe9e3;          /* avatars, pressed */
  --bubble-in: var(--surface-hover);  /* assistant / agent bubbles: soft warm grey, no border */
  --ink-rgb: 41 37 36;
  --shadow-xs: 0 0 0 1px rgb(var(--ink-rgb) / 0.08), 0 1px 2px rgb(var(--ink-rgb) / 0.06);
  --shadow-1: 0 0 0 1px rgb(var(--ink-rgb) / 0.05), 0 1px 2px rgb(var(--ink-rgb) / 0.05), 0 4px 12px -4px rgb(var(--ink-rgb) / 0.08);
  --shadow-2: 0 0 0 1px rgb(var(--ink-rgb) / 0.06), 0 2px 6px rgb(var(--ink-rgb) / 0.05), 0 16px 36px -8px rgb(var(--ink-rgb) / 0.18);
  --shadow-3: 1px 0 0 rgb(var(--ink-rgb) / 0.06), 12px 0 40px -12px rgb(var(--ink-rgb) / 0.22);
  --shadow-dock-l: -1px 0 0 var(--line);
  --ring-action: 0 0 0 1px var(--action);
  --scrim: rgb(28 25 23 / 0.20);
  --radius-md: 12px;
  /* legacy aliases so older rules resolve to the system */
  --shadow-card: var(--shadow-1); --shadow-popover: var(--shadow-2); --shadow-dialog: var(--shadow-2);
  --sidebar: var(--surface);
}

/* ---- Level 0: header bars, docked side panel, list ---- */
.ib-head, .cv-bar, .pagebar { background: var(--bg); border-bottom: 1px solid var(--line); min-height: 44px; padding: 6px 14px; gap: 8px; box-sizing: border-box; }
.cv-side { position: relative; background: var(--surface); border-left: 0; box-shadow: var(--shadow-dock-l); padding: 16px; gap: 16px; }
.ib-cols { background: var(--bg); border-radius: 0; }

/* ---- Level 1: raised cards (shadow, no border) ---- */
.vn, .sumcard, .sec, .k-tl, .k-summary,
.ob-points, .ob-choice, .ob-demo, .ob-newnum, .opt { border: 0; box-shadow: var(--shadow-1); }
.vn { background: var(--surface); }
.vn-knob, .vn .vn-knob { box-shadow: 0 0 0 3px var(--surface); }
.vn-speed { background: var(--surface-hover); border: 0; box-shadow: none; }
.vn-speed:hover { background: var(--surface-strong); }
.sumcard, .sec, .opt, .ob-choice, .ob-newnum, .ob-points, .ob-demo { background: var(--surface); }
.sumcard, .sec { padding: 16px; gap: 12px; }
.opt.on, .ob-choice.on { background: var(--highlight); box-shadow: var(--ring-action), var(--shadow-1); }
.ob-prompt { border: 0; box-shadow: var(--ring-action), var(--shadow-1); }
.ob-prompt.ok { box-shadow: none; }

/* ---- Level 2: floating (palette, remind, search, help, toast, tooltips) ---- */
.k-cmd, .help-sheet { background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-2); }
.toast { background: var(--ink); color: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-2); }
.kt { border-radius: var(--radius-xs); box-shadow: var(--shadow-2); font-size: 11px; }
.overlay, .app.nav-open .scrim { background: var(--scrim); }

/* ---- Level 3: drawer nav ---- */
.nav { background: var(--surface); border-right: 0; box-shadow: var(--shadow-3); }
.nav-foot { border-top-color: var(--line); }

/* ---- Transcript ---- */
.k-msg-them .k-bubble, .k-bubble.k-tone-neutral, .k-msg-them .k-bubble.k-tone-neutral { background: var(--bubble-in); border: 0; }
.k-day span { border: 0; background: var(--surface-hover); }

/* ---- Colors: palette vars only ---- */
.k-avatar { background: var(--surface-strong); }
.k-avatar-ai { background: var(--signal-soft); }

/* ---- Interaction states: one hover, one selected, everywhere ---- */
.row:hover, .nav-item:hover, .side-call:hover, .cv-side .side-call:hover,
.k-btn-ghost:hover, .k-btn-secondary:hover, .ib-tab:hover { background: var(--surface-hover); }
.side-call.is-old:hover { background: transparent; }
.row.is-cursor, .ob-row.is-cursor { background: var(--highlight); box-shadow: inset 2px 0 0 var(--action); }
.nav-item[aria-current="page"], .ib-tab[aria-selected="true"], .k-cmd-item[aria-selected="true"] { background: var(--highlight); color: var(--highlight-ink); }
.k-cmd-item[aria-selected="true"] .k-icon { color: var(--highlight-ink); }
.r-acts { background: transparent; }
.row:hover .r-acts { background: var(--surface-hover); }
.row.is-cursor .r-acts { background: var(--highlight); }
.r-act:hover { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-xs); }

/* ---- Controls: buttons, segments, inputs, badges, kbd ---- */
.k-btn-secondary { background: var(--surface); border-color: transparent; box-shadow: var(--shadow-xs); }
.k-btn-secondary:disabled, .k-btn:disabled { box-shadow: none; }
.k-btn-sm { font-size: 12px; }
.side-who { width: 100%; }
.side-who > div { flex: 1; }
.side-open { margin-left: auto; align-self: center; color: var(--ink-muted); }



.k-composer { border-radius: var(--radius-sm); }
.k-input input, .ta { font-size: 13px; }
.k-badge, .k-livei, .cv .k-livei, .r-status .k-badge, .r-status .k-livei, .sum-h .k-badge { height: 18px; font-size: 11px; padding: 0 6px; gap: 5px; }
.k-livei time, .r-status .k-livei time { font-size: 11px; }
.k-kbd, .k-btn-sm .k-kbd, .nav-item .k-kbd { height: 18px; min-width: 18px; padding: 0 4px; font-size: 11px; }
.ib-hint .k-kbd, .kt kbd { height: 16px; min-width: 16px; padding: 0 3px; font-size: 10px; }
.k-btn-primary .k-kbd, .k-btn-danger .k-kbd { background: transparent; border-color: currentColor; }
.nav-item, .k-cmd-item { height: 32px; font-size: 13px; }
.ib-tab { height: 24px; font-size: 13px; }

/* ---- Type scale ---- */
/* 11: captions, section labels, mono numbers */
.ib-cols, .sum-label, .side-sec h2, .help-group h3, .k-cmd-group, .k-summary-label { font-size: 11px; font-weight: 500; color: var(--ink-muted); }
.r-dur, .r-time, .cv-pos, .sc-top .mono, .side-facts dd.mono,
span.mono, .facts dd.mono, .ib-tab .n, .ib-mode .n, .nav-n, .cv-who .sub, .k-meta, .cv .k-meta, .k-event-in time { font-size: 11px; }
.sum-h small, .tr-h span, .compose small, .cv .k-event, .r-quiet, .sc-sub, .ib-search-n { font-size: 11px; }
/* 12: secondary text */
.help, .page-head p, .sec > p, .opt span, .side-who span, .ob-choice span, .ob-point span, .me small,
.k-cmd-foot, .help-foot, .side-facts, .sc-top, .ob-newnum span { font-size: 12px; }
/* 13: body / UI */
