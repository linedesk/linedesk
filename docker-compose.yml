# The whole application. Self-hosting: `docker compose up -d --build` (see README).
# Development adds docker-compose.dev.yml (local ports for the apps running on the host) through
# `pnpm db:up`, `pnpm voice:up` and `pnpm recording:up`.
#
# Isolation: its own project name and network, data only in named volumes, every service with a
# restart policy, rotated logs and hard memory and CPU limits (override with the CALLFRONT_* variables).
# CPU: the call-audio services (LiveKit, SIP, the agent, egress) share one pinned core
# (CALLFRONT_VOICE_CPUSET) instead of a quota, because a quota stalls real-time audio even when idle;
# the other services have quotas that add up to half a core. At most 1.5 CPUs in all.
# Published host ports: Caddy (CALLFRONT_HTTP_BIND) and LiveKit's call audio and SIP ports. Nothing else.
name: callfront

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

services:
  postgres:
    <<: *service
    image: postgres:17
    command: ["postgres", "-c", "wal_level=logical", "-c", "shared_buffers=64MB"]
    environment:
      POSTGRES_USER: callfront
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-callfront} # development default; the API container refuses it
      POSTGRES_DB: callfront
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callfront"]
      interval: 2s
      retries: 20
    mem_limit: ${CALLFRONT_POSTGRES_MEM:-128m}
    cpus: ${CALLFRONT_POSTGRES_CPUS:-0.1}

  electric:
    <<: *service
    image: electricsql/electric:1.8.1
    environment:
      DATABASE_URL: postgres://callfront:${POSTGRES_PASSWORD:-callfront}@postgres:5432/callfront?sslmode=disable
      ELECTRIC_INSECURE: "true" # only the API talks to Electric; it adds the workspace filter
      ELECTRIC_DB_POOL_SIZE: "10"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/v1/health | grep -q active"]
      interval: 2s
      retries: 30
    mem_limit: ${CALLFRONT_ELECTRIC_MEM:-320m}
    cpus: ${CALLFRONT_ELECTRIC_CPUS:-0.2}

  api:
    <<: *service
    build: { context: ., target: api }
    image: callfront-api
    # Settings and secrets come from .env; the addresses inside the compose network are set here.
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgres://callfront:${POSTGRES_PASSWORD:-callfront}@postgres:5432/callfront
      ELECTRIC_URL: http://electric:3000
      PORT: "3100"
      WEB_ORIGIN: ${PUBLIC_URL:-http://localhost}
      BETTER_AUTH_URL: ${PUBLIC_URL:-http://localhost}
      # Only Caddy and the agent reach the API, from Docker's private networks: rate limits then take the
      # client address from the X-Forwarded-For hop Caddy adds (apps/api/src/client-ip.ts).
      TRUSTED_PROXIES: 172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
      RECORDINGS_DIR: /recordings # where RECORDING_STORE=file recordings are read from
    volumes: ["recordings:/recordings:ro"]
    depends_on:
      postgres: { condition: service_healthy }
      electric: { condition: service_healthy }
    mem_limit: ${CALLFRONT_API_MEM:-128m}
    cpus: ${CALLFRONT_API_CPUS:-0.1}

  # Caddy: the web entry point. Serves the web app and proxies /api, /v1 and LiveKit signalling (/rtc).
  # Plain HTTP here: on CALLFRONT_HTTP_BIND (default: port 80 on all interfaces), or behind an existing
  # reverse proxy with for example CALLFRONT_HTTP_BIND=127.0.0.1:8480. docker-compose.https.yml makes
  # this Caddy get the certificate itself.
  web:
    <<: *service
    build: { context: ., target: web }
    image: callfront-web
    ports: ["${CALLFRONT_HTTP_BIND:-80}:80"]
    volumes: ["caddy_data:/data"]
    depends_on:
      api: { condition: service_healthy }
    mem_limit: ${CALLFRONT_WEB_MEM:-48m}
    cpus: ${CALLFRONT_WEB_CPUS:-0.05}

  # Voice: LiveKit server, its SIP bridge and the Redis-compatible store they share.
  # The key and secret must be in .env (.env.example has development values; the API and the agent
  # containers refuse those). Signalling (7880) is not published: browsers reach it through Caddy (/rtc).
  # Call audio and SIP cannot go through an HTTP proxy, so those ports are published on the host,
  # on LIVEKIT_BIND_IP (default 127.0.0.1; 0.0.0.0 on a server).
  redis:
    <<: *service
    image: valkey/valkey:8.1.11-alpine
    mem_limit: ${CALLFRONT_REDIS_MEM:-48m}
    cpus: ${CALLFRONT_REDIS_CPUS:-0.05}

  livekit:
    <<: *service
    image: livekit/livekit-server:v1.13.11
    # The address clients are told to send media to. 127.0.0.1 for local development;
    # the server's public IP when carriers and browsers connect from outside.
    command: ["--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}"]
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
        redis:
          address: redis:6379
        keys:
          ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env (see .env.example)}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env (see .env.example)}
    ports:
      - "${LIVEKIT_BIND_IP:-127.0.0.1}:7881:7881"       # WebRTC over TCP
      - "${LIVEKIT_BIND_IP:-127.0.0.1}:7882:7882/udp"   # WebRTC over UDP
      - "${LIVEKIT_BIND_IP:-127.0.0.1}:5060:5060/udp"   # SIP (served by livekit-sip, which shares this network namespace)
      - "${LIVEKIT_BIND_IP:-127.0.0.1}:5060:5060/tcp"
      - "${LIVEKIT_BIND_IP:-127.0.0.1}:10000-10100:10000-10100/udp" # SIP media (RTP)
    depends_on: [redis]
    mem_limit: ${CALLFRONT_LIVEKIT_MEM:-96m}
    cpuset: ${CALLFRONT_VOICE_CPUSET:-1} # the voice core, shared by LiveKit, SIP, the agent and egress

  livekit-sip:
    <<: *service
    image: livekit/sip:v1.23.0
    network_mode: "service:livekit" # so it reaches LiveKit media on the advertised node IP
    environment:
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env (see .env.example)}
        api_secret: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env (see .env.example)}
        ws_url: ws://localhost:7880
        redis:
          address: redis:6379
        sip_port: 5060
        rtp_port: 10000-10100
        # true on a server that carriers reach from the internet: SIP then announces the public IP
        use_external_ip: ${LIVEKIT_SIP_USE_EXTERNAL_IP:-false}
    depends_on: [livekit, redis]
    mem_limit: ${CALLFRONT_SIP_MEM:-96m}
    cpuset: ${CALLFRONT_VOICE_CPUSET:-1} # the voice core, shared by LiveKit, SIP, the agent and egress

  # The voice agent: answers calls in LiveKit rooms and writes to the API.
  # Without its speech and LLM keys it starts, logs one line and waits.
  agent:
    <<: *service
    build: { context: ., target: agent }
    image: callfront-agent
    env_file: [{ path: .env, required: false }]
    environment:
      CALLFRONT_API_URL: http://api:3100
      LIVEKIT_URL: ws://livekit:7880
      AGENT_IDLE_PROCESSES: ${AGENT_IDLE_PROCESSES:-1} # processes kept warm for the next call
    depends_on:
      api: { condition: service_healthy }
      livekit: { condition: service_started }
    mem_limit: ${CALLFRONT_AGENT_MEM:-672m}
    cpuset: ${CALLFRONT_VOICE_CPUSET:-1} # the voice core, shared by LiveKit, SIP, the agent and egress

  # Call recordings (optional): add `--profile recording`, or `pnpm recording:up` in development.
  # LiveKit egress records each call room into the recordings volume, where the API reads the files.
  livekit-egress:
    <<: *service
    image: livekit/egress:v1.15.0
    profiles: [recording]
    network_mode: "service:livekit" # same reason as livekit-sip
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env (see .env.example)}
        api_secret: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env (see .env.example)}
        ws_url: ws://localhost:7880
        insecure: true
        redis:
          address: redis:6379
    volumes: ["recordings:/recordings"]
    depends_on:
      livekit: { condition: service_started }
      redis: { condition: service_started }
      recordings-init: { condition: service_completed_successfully }
    mem_limit: ${CALLFRONT_EGRESS_MEM:-512m}
    cpuset: ${CALLFRONT_VOICE_CPUSET:-1} # the voice core, shared by LiveKit, SIP, the agent and egress

  # Egress runs as uid 1001 and a new volume belongs to root: hand the directory over once.
  recordings-init:
    image: busybox:1.37
    profiles: [recording]
    command: ["chown", "1001:0", "/recordings"]
    volumes: ["recordings:/recordings"]
    restart: "no"
    logging:
      driver: json-file
      options: { max-size: 1m, max-file: "1" }

volumes:
  pgdata:
  caddy_data:
  recordings:
