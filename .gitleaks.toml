# Secret scanning (gitleaks), run by the `secrets` job in .github/workflows/ci.yml. See docs/ci.md.
# Starts from gitleaks' default rules; only the exceptions below are ours.

[extend]
useDefault = true

# Made-up keys in tests contain the run 0123456789 on purpose (e.g. 'bucket-secret-0123456789').
# A real key never does, so anything else is still caught, in tests too.
[[allowlists]]
description = "Fake keys marked with 0123456789"
regexTarget = "secret"
regexes = ['''0123456789''']

# A made-up Calendly token in a test, committed before it carried 0123456789 (PR #688). Only that commit and file.
[[allowlists]]
description = "Fake Calendly token in scheduling-tools.test.ts, commit 2b7660fc"
condition = "AND"
commits = ["2b7660fc5bba18589c0447f49d39b180c018af23"]
paths = ['''^packages/calendar/src/scheduling-tools\.test\.ts$''']
